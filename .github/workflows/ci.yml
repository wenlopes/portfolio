name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true

      - name: Lint (Go + CloudFormation)
        run: make lint

      - name: Start MiniStack and deploy data + app stacks
        run: make up deploy-local

      - name: Test (unit + integration + coverage)
        run: make test

      - name: Docs
        run: make docs-build > /dev/null
